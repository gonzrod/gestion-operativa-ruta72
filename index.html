<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta72Ops - Gestión Operativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10" x-data="{ tab: 'frio' }">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-20 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-orange-600 tracking-tight">🍕 Ruta72Ops</h1>
            <span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-1 rounded-full font-bold uppercase">Modo Local</span>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-[61px] z-10 text-[11px] font-semibold">
        <div class="max-w-md mx-auto flex">
            <button @click="tab = 'masas'" :class="tab === 'masas' ? 'border-b-2 border-orange-600 text-orange-600 bg-orange-50' : 'text-slate-500'" class="flex-1 py-4 transition-all uppercase">Masas</button>
            <button @click="tab = 'pesos'" :class="tab === 'pesos' ? 'border-b-2 border-orange-600 text-orange-600 bg-orange-50' : 'text-slate-500'" class="flex-1 py-4 transition-all uppercase">Pesos</button>
            <button @click="tab = 'frio'" :class="tab === 'frio' ? 'border-b-2 border-orange-600 text-orange-600 bg-orange-50' : 'text-slate-500'" class="flex-1 py-4 transition-all uppercase">Frío</button>
            <button @click="tab = 'tiempos'" :class="tab === 'tiempos' ? 'border-b-2 border-orange-600 text-orange-600 bg-orange-50' : 'text-slate-500'" class="flex-1 py-4 transition-all uppercase">Tiempos</button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4">

        <!-- TAB 1: MASAS (Calculadora de Batidas) -->
        <section x-show="tab === 'masas'" x-cloak x-data="{ amanecio: 0, hoy: 200, mañana: 200 }">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800 mb-2">Calculadora de Batidas</h2>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Bolas al amanecer</label>
                    <input type="number" x-model.number="amanecio" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Venta Hoy</label>
                        <input type="number" x-model.number="hoy" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Venta Mañana</label>
                        <input type="number" x-model.number="mañana" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>
                <div class="mt-6 p-5 bg-orange-600 rounded-2xl text-white shadow-lg shadow-orange-200 text-center">
                    <p class="text-orange-100 text-xs font-bold uppercase">Batidas Necesarias</p>
                    <p class="text-4xl font-black" x-text="(((Math.max(0, hoy - amanecio)) + mañana) / 31).toFixed(1)"></p>
                </div>
            </div>
        </section>

        <!-- TAB 2: PESOS (Inventario por Peso) -->
        <section x-show="tab === 'pesos'" x-cloak x-data="{ bruto: 0, tara: 0.125 }">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800 mb-2">Inventario por Peso</h2>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo de Recipiente</label>
                    <select x-model.number="tara" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                        <option value="0.125">Bote especias (125g)</option>
                        <option value="1.02">Bote salsa (1.02kg)</option>
                        <option value="1.27">Bote harina (1.27kg)</option>
                        <option value="0.210">Lexan sexto (210g)</option>
                        <option value="0.390">Lexan tercio (390g)</option>
                        <option value="0.560">Lexan medio (560g)</option>
                        <option value="1.15">Lexan entero (1.15kg)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Peso en Báscula (kg)</label>
                    <input type="number" step="0.001" x-model.number="bruto" placeholder="0.000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mt-6 p-5 bg-blue-600 rounded-2xl text-white shadow-lg shadow-blue-200 text-center">
                    <p class="text-blue-100 text-xs font-bold uppercase">Peso Neto del Insumo</p>
                    <p class="text-4xl font-black" x-text="Math.max(0, bruto - tara).toFixed(3) + ' kg'"></p>
                </div>
            </div>
        </section>

        <!-- TAB 3: CUARTO FRIO -->
        <section x-show="tab === 'frio'" x-cloak 
            x-data="{ 
                items: [
                    { name: 'PEPPERONI (JABA DE 4)', spec: '4 X 5.67KG', bagsPerJaba: 4, weightPerBag: 5.67, jabas: '', bags: '' },
                    { name: 'PASTA TOMATE', spec: '12 X 3KG', bagsPerJaba: 12, weightPerBag: 3, jabas: '', bags: '' },
                    { name: 'QUESO PARA PIZZA', spec: '6 X 2KG', bagsPerJaba: 6, weightPerBag: 2, jabas: '', bags: '' },
                    { name: 'QUESO EN TIRA', spec: '2 X 6.8KG', bagsPerJaba: 2, weightPerBag: 6.8, jabas: '', bags: '' }
                ],
                getTotalBags(item) {
                    let j = Number(item.jabas) || 0;
                    let b = Number(item.bags) || 0;
                    return (j * item.bagsPerJaba) + b;
                },
                getTotalWeight(item) {
                    return (this.getTotalBags(item) * item.weightPerBag).toFixed(2);
                }
            }">
            <div class="bg-white border-2 border-blue-500 rounded-xl p-4 shadow-sm space-y-6">
                <div class="flex items-center justify-center gap-2 py-2">
                    <svg class="w-6 h-6 text-blue-700" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                    <h2 class="text-blue-700 font-bold text-xl tracking-tight uppercase">CALCULADORA DE INVENTARIO</h2>
                </div>

                <div class="space-y-8">
                    <template x-for="(item, index) in items" :key="index">
                        <div class="space-y-2">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase px-1" x-text="item.name + ' (' + item.spec + ')'"></label>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <input type="number" x-model="item.jabas" placeholder="Jabas" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-lg text-gray-700 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none transition-all placeholder:text-gray-300">
                                    <span class="text-[9px] text-gray-400 font-bold uppercase mt-1 block px-1">Jabas Completas</span>
                                </div>
                                <div>
                                    <input type="number" x-model="item.bags" placeholder="Bolsas" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-lg text-gray-700 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none transition-all placeholder:text-gray-300">
                                    <span class="text-[9px] text-gray-400 font-bold uppercase mt-1 block px-1">Bolsas Sueltas</span>
                                </div>
                            </div>

                            <div class="flex justify-between items-center bg-blue-50 p-3 rounded-xl">
                                <div>
                                    <p class="text-[10px] font-bold text-blue-500 uppercase">Total Bolsas</p>
                                    <p class="text-lg font-black text-blue-800" x-text="getTotalBags(item)"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-bold text-blue-500 uppercase">Peso Estimado</p>
                                    <p class="text-lg font-black text-blue-800" x-text="getTotalWeight(item) + ' kg'"></p>
                                </div>
                            </div>

                            <div class="pt-4 border-b border-gray-100 last:border-0"></div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- TAB 4: TIEMPOS (Planificador de Batidas) -->
        <section x-show="tab === 'tiempos'" x-cloak 
            x-data="{ 
                batidas: 1, 
                horaInicio: '',
                calcularFin() {
                    if (!this.horaInicio || this.batidas <= 0) return '--:--';
                    const minutosTotales = Math.round(this.batidas * 30);
                    const [h, m] = this.horaInicio.split(':').map(Number);
                    const fecha = new Date();
                    fecha.setHours(h, m + minutosTotales);
                    return fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                },
                formatearDuracion() {
                    const mins = Math.round(this.batidas * 30);
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    return h > 0 ? `${h}h ${m}m` : `${m} min`;
                }
            }">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                <h2 class="text-lg font-bold text-slate-800 mb-2">Planificador de Tiempos</h2>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Batidas a realizar</label>
                    <input type="number" step="0.1" x-model.number="batidas" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none text-xl font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Hora de inicio</label>
                    <input type="time" x-model="horaInicio" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none text-xl">
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div class="bg-slate-100 p-4 rounded-xl text-center">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">Duración</p>
                        <p class="text-xl font-black text-slate-700" x-text="formatearDuracion()"></p>
                    </div>
                    <div class="bg-green-600 p-4 rounded-xl text-center text-white shadow-md shadow-green-100">
                        <p class="text-[10px] font-bold text-green-100 uppercase">Terminarás a las</p>
                        <p class="text-xl font-black" x-text="calcularFin()"></p>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
